/* Material 3 Expressive Calendar Card */
.calendar-card {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: 28px;
    padding: 1.5rem;
}

/* Weekdays labels */
.weekdays-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    text-align: center;
    margin-bottom: 0.75rem;
}

.weekdays-grid div {
    font-size: 0.8rem;
    font-weight: 650;
    color: var(--on-surface-variant);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.5rem 0;
}

/* Calendar Grid */
.days-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 0.4rem;
}

/* Individual Day Cell */
.day-cell {
    aspect-ratio: 1.05;
    background: var(--cell-background);
    border: 1px solid var(--outline);
    border-radius: 12px;
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-start;
    cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease;
    user-select: none;
}

.day-cell:hover {
    background: var(--surface-variant);
    border-color: var(--on-surface-variant);
}

.day-number {
    font-size: 1rem;
    font-weight: 600;
    color: var(--on-surface-variant);
    display: flex;
    justify-content: center;
    align-items: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    transition: background-color 0.2s ease, color 0.2s ease;
}

/* Adjacent/Previous Month Days */
.day-cell.adjacent-month {
    opacity: 0.25;
}

.day-cell.adjacent-month:hover {
    opacity: 0.5;
}

/* Today Highlighter - Re-formatted to highlight the container instead of a circle around the number */
.day-cell.today {
    border: 2px solid var(--primary) !important;
    background: color-mix(in srgb, var(--primary) 5%, transparent) !important;
}

.day-cell.today:hover {
    background: color-mix(in srgb, var(--primary) 12%, transparent) !important;
}

.day-cell.today .day-number {
    border: none !important;
    background: transparent !important;
    color: var(--primary) !important;
    font-weight: 850 !important;
    font-size: 1.35em !important;
    width: auto !important;
    height: auto !important;
}

/* Today with shift */
.day-cell.today.has-shift {
    background: color-mix(in srgb, var(--primary) 15%, transparent) !important;
}

.day-cell.today.has-shift .day-number {
    color: var(--primary) !important;
}

/* Today selected */
.day-cell.today.selected {
    background: color-mix(in srgb, var(--primary) 20%, transparent) !important;
}

/* Day with shift - Styled in signature purple */
.day-cell.has-shift {
    background: color-mix(in srgb, var(--primary) 8%, transparent);
    border-color: color-mix(in srgb, var(--primary) 35%, transparent);
}

.day-cell.has-shift:hover {
    background: color-mix(in srgb, var(--primary) 16%, transparent);
    border-color: color-mix(in srgb, var(--primary) 60%, transparent);
}

.day-cell.has-shift .day-number {
    background: var(--brand-green);
    color: var(--on-primary);
}

.shift-tag {
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--on-primary-container, #ffffff);
    background: var(--brand-green-container);
    border-radius: 4px;

    width: 100%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: auto;
}

/* Selected State */
.day-cell.selected {
    background: color-mix(in srgb, var(--on-surface) 8%, transparent);
    border-color: var(--primary);
}

.day-cell.selected.has-shift {
    background: color-mix(in srgb, var(--primary) 22%, transparent);
    border-color: var(--primary);
}

/* Material 3 Segmented / Tonal buttons */
.settings-toggle {
    background: var(--surface-variant);
    border: 1px solid var(--outline);
    color: var(--on-surface-variant);
    cursor: pointer;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s ease;
    user-select: none;
    -webkit-user-select: none;
}

.settings-toggle:hover,
.settings-toggle.active {
    color: var(--on-surface);
    background: color-mix(in srgb, var(--on-surface) 10%, transparent);
    border-color: var(--on-surface-variant);
}



.settings-tray {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: 16px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    animation: slide-down 0.2s ease-out;
}

@keyframes slide-down {
    0% {
        transform: translateY(-8px);
        opacity: 0;
    }

    100% {
        transform: translateY(0);
        opacity: 1;
    }
}

.settings-group {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.settings-label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--on-surface-variant);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.settings-label svg {
    flex-shrink: 0;
    opacity: 0.7;
}

.toggle-group {
    position: relative;
    display: inline-flex;
    background: var(--surface-variant);
    border: 1px solid var(--outline);
    border-radius: 20px;
    padding: 2px;
    user-select: none;
    -webkit-user-select: none;
    isolation: isolate;
}

.toggle-group::before {
    content: '';
    position: absolute;
    top: 2px;
    bottom: 2px;
    left: 2px;
    width: calc(50% - 2px);
    border-radius: 18px;
    background: var(--primary);
    transition: transform 0.35s cubic-bezier(0.34, 1.15, 0.64, 1);
    pointer-events: none;
    z-index: 1;
}

.toggle-group[data-active="1"]::before,
.toggle-group:has(.toggle-option:nth-child(2).active)::before {
    transform: translateX(100%);
}

.toggle-option {
    position: relative;
    z-index: 2;
    flex: 1;
    background: transparent !important;
    border: none;
    color: var(--on-surface-variant);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 18px;
    cursor: pointer;
    transition: color 0.25s ease;
    user-select: none;
    -webkit-user-select: none;
    text-align: center;
    white-space: nowrap;
}

.toggle-option:hover {
    color: var(--on-surface);
}

.toggle-option.active,
.toggle-option.active:hover {
    color: var(--on-primary, #ffffff);
}

.export-tray-buttons {
    display: flex;
    gap: 6px;
}

.export-tray-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-variant);
    border: 1px solid var(--outline);
    color: var(--on-surface-variant);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 18px;
    cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
    user-select: none;
    -webkit-user-select: none;
}

.export-tray-btn:hover {
    background: var(--primary-container);
    border-color: var(--primary);
    color: var(--on-primary-container);
}



/* View Switcher */
.view-switcher-container {

.view-switcher {
